<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="AIPP TOEFL TEAM — AIPProject03 Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1F" />
      <stop offset="55%" stop-color="#0B1733" />
      <stop offset="100%" stop-color="#12275C" />
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
    <radialGradient id="glowRight" cx="82%" cy="35%" r="42%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0B1733" stop-opacity="0" />
    </radialGradient>
    <clipPath id="rounded">
      <rect x="0" y="0" width="1200" height="320" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Base institutional navy canvas -->
    <rect width="1200" height="320" fill="url(#bgGrad)" />
    <rect width="1200" height="320" fill="url(#grid)" />
    <rect width="1200" height="320" fill="url(#glowRight)" />

    <!-- Top accent rail -->
    <rect x="0" y="0" width="1200" height="4" fill="url(#accentBar)" />

    <!-- Subtle animated shimmer line across top rail -->
    <rect x="-300" y="0" width="300" height="4" fill="url(#shimmer)">
      <animate attributeName="x" from="-300" to="1200" dur="4.5s" repeatCount="indefinite" />
    </rect>

    <!-- Decorative right-side institutional score ring motif -->
    <g transform="translate(995, 160)">
      <circle cx="0" cy="0" r="92" fill="#081126" fill-opacity="0.72" stroke="#1E3A8A" stroke-width="1.5" />
      <circle cx="0" cy="0" r="74" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="8" />
      <circle
        cx="0"
        cy="0"
        r="74"
        fill="none"
        stroke="#22D3EE"
        stroke-width="8"
        stroke-linecap="round"
        stroke-dasharray="465"
        stroke-dashoffset="92"
        transform="rotate(-90)"
      >
        <animate attributeName="stroke-dashoffset" values="465;78;78" dur="2.2s" fill="freeze" />
      </circle>
      <text x="0" y="-22" text-anchor="middle" fill="#67E8F9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="2">2026 BAND</text>
      <text x="0" y="18" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="800">5.5</text>
      <text x="0" y="40" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500">CEFR C1 · 1.0–6.0</text>
    </g>

    <!-- Left typography block -->
    <g transform="translate(64, 72)">
      <rect x="0" y="0" width="236" height="28" rx="6" fill="#1D4ED8" fill-opacity="0.24" stroke="#38BDF8" stroke-opacity="0.35" />
      <text x="14" y="18" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="0.8">AIPProject03 · TOEFL iBT 2026</text>

      <text x="0" y="80" fill="#FFFFFF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="50" font-weight="800" letter-spacing="-1">
        AIPP TOEFL TEAM
      </text>

      <text x="0" y="114" fill="#CBD5E1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="500">
        TOEFL iBT Simulation &amp; Learning Platform
      </text>

      <text x="0" y="148" fill="#38BDF8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" letter-spacing="0.3">
        “Practice Smarter. Perform Better. Reach Your Target.”
      </text>

      <!-- Bottom key capability chips -->
      <g transform="translate(0, 174)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600">
        <rect x="0" y="0" width="142" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14" />
        <text x="71" y="19" text-anchor="middle" fill="#E2E8F0">10 Test Modes</text>

        <rect x="154" y="0" width="166" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14" />
        <text x="237" y="19" text-anchor="middle" fill="#E2E8F0">Adaptive Stage 1 → 2</text>

        <rect x="332" y="0" width="166" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14" />
        <text x="415" y="19" text-anchor="middle" fill="#E2E8F0">JSON Pack Importer</text>

        <rect x="510" y="0" width="176" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14" />
        <text x="598" y="19" text-anchor="middle" fill="#E2E8F0">3-Page PDF Certificate</text>
      </g>
    </g>

    <!-- Subtle outer border -->
    <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#334155" stroke-opacity="0.6" />
  </g>
</svg>
